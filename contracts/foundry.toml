[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.34"
optimizer = true
optimizer_runs = 200
# 0.8.34+ only — 0.8.28-0.8.33 have a transient-storage IR bug where via-ir can emit sstore
# instead of tstore (and vice versa) when clearing storage. Needed here: MandateRegistrar's
# _issue() has enough locals to hit "stack too deep" without it.
via_ir = true
fs_permissions = [{ access = "read", path = "./" }]

remappings = [
  "forge-std/=lib/forge-std/src/",
  "openzeppelin-contracts/=lib/openzeppelin-contracts/contracts/",
  "contracts/=src/",
  "contracts-test/=test/",
]

[fuzz]
runs = 1024

[invariant]
runs = 256
depth = 64
fail_on_revert = false

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
int_types = "long"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
